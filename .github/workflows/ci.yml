name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install --cask gcc-arm-embedded
          brew install qemu

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Versions
        run: |
          arm-none-eabi-gcc --version | head -1
          qemu-system-arm --version | head -1

      - name: Build firmware
        run: make -C firmware

      - name: Tests
        run: python -m pytest tests -q

      - name: Validate bounds against QEMU
        run: python tools/validate.py --skip-build

      - name: Stack gate on every benchmark
        run: |
          for c in direct table global_fp param_fp recursion isr_nesting; do
            echo "--- $c"
            python -m stackbound check "firmware/build/$c.elf" \
                   --config "firmware/config/$c.json"
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-py${{ matrix.python }}
          path: results/

  mutations:
    name: sabotage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm
      - run: pip install -e ".[dev]"
      - run: make -C firmware
      - name: Every mutation must be caught by a test
        run: python tools/sabotage.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check stackbound tools tests
      - run: ruff format --check stackbound tools tests
