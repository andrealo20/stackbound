name: stackbound
description: >
  Fail the build when a Cortex-M firmware cannot be shown to fit in its stack
  region, taking interrupt preemption and indirect calls into account.
author: Andrea Loroni
branding:
  icon: bar-chart-2
  color: blue

inputs:
  elf:
    description: Path to the firmware ELF (unstripped, built with -g)
    required: true
  config:
    description: Path to the stackbound JSON configuration
    required: false
    default: ""
  stack-size:
    description: >
      Stack region size in bytes. Optional when the linker script exports
      _stack_bottom and _stack_top.
    required: false
    default: ""
  allow-unbounded:
    description: >
      Report a component with no stated depth as a lower bound (exit 3) instead
      of failing outright (exit 2). The step still fails either way.
    required: false
    default: "false"

outputs:
  total:
    description: The whole-program bound in bytes
    value: ${{ steps.run.outputs.total }}
  headroom:
    description: Bytes left in the stack region
    value: ${{ steps.run.outputs.headroom }}

runs:
  using: composite
  steps:
    - name: Install stackbound
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pip install --quiet "$ACTION_PATH"

    # Every input reaches the script through the environment and is quoted where
    # it is used.  Interpolating ${{ inputs.* }} into the body would let the
    # value be read as shell.
    #
    # The check exits 0 when the firmware fits, 1 when it does not, 2 when a
    # reachable component has no bound, and 3 when the number is only a lower
    # bound or the stack region is unknown.
    - id: run
      shell: bash
      env:
        ELF: ${{ inputs.elf }}
        CONFIG: ${{ inputs.config }}
        STACK_SIZE: ${{ inputs.stack-size }}
        ALLOW_UNBOUNDED: ${{ inputs.allow-unbounded }}
      run: |
        args=("$ELF")
        if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
        if [ -n "$STACK_SIZE" ]; then args+=(--stack-size "$STACK_SIZE"); fi

        # --allow-unbounded exists only on check, and a bare test as the last
        # command of a line would end the step under `set -e`.
        check_args=("${args[@]}")
        if [ "$ALLOW_UNBOUNDED" = "true" ]; then check_args+=(--allow-unbounded); fi

        python -m stackbound report "${args[@]}" | tee report.txt
        python -m stackbound report "${args[@]}" --json > report.json
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        d = json.load(open("report.json"))
        print(f"total={d['total']}")
        print(f"headroom={d['headroom']}")
        PY
        {
          echo "### stackbound"
          echo '```'
          cat report.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        python -m stackbound check "${check_args[@]}"
